<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/">
     <!-- <base href="./"> -->

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">
  <meta name="version" content="1.0.0">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="cargosimply">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon — multiple sizes so browsers pick best resolution -->
  <link rel="icon" type="image/png" sizes="16x16" href="favicon.png"/>
  <link rel="icon" type="image/png" sizes="192x192" href="icons/Icon-192.png"/>
  <link rel="icon" type="image/png" sizes="512x512" href="icons/Icon-512.png"/>

  <title>CargoSimply</title>
  <link rel="manifest" href="manifest.json">

  <script>
    // mobile_scanner_web.dart creates video elements without 'muted' or
    // 'playsinline'. On mobile Chrome, calling play() on such an element is
    // blocked by the autoplay policy → ZXing swallows the NotAllowedError →
    // waits for the 'playing' event that never fires → hangs forever.
    // Patch play() globally to add these attributes before every call.
    (function () {
      var _origPlay = HTMLVideoElement.prototype.play;
      HTMLVideoElement.prototype.play = function () {
        this.muted = true;
        this.setAttribute('playsinline', 'true');
        return _origPlay.apply(this, arguments);
      };
    })();
  </script>

  <!-- Auto-detect base path script -->
  <script>
    // Auto-detect the base path from the current URL
    if (document.querySelector('base').getAttribute('href') === '/') {
      var currentPath = window.location.pathname;
      var basePath = currentPath.substring(0, currentPath.lastIndexOf('/') + 1);
      if (basePath === '/') {
        basePath = './';
      }
      document.querySelector('base').setAttribute('href', basePath);
    }
  </script>

</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
